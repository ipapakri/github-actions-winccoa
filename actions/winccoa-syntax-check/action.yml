name: "WinCC OA Syntax Check"
description: "Run WinCC OA syntax validation via @winccoa-tools-pack/npm-winccoa-syntax-check"
author: "winccoa-tools-pack"

inputs:
  path:
    description: "Path to WinCC OA project root relative to the repository root"
    required: false
    default: "."

  fail-on-error:
    description: "Fail workflow on syntax errors"
    required: false
    default: "true"

  winccoa-version:
    description: "WinCC OA version installed in the image/host, for example 3.21"
    required: true

  languages:
    description: >-
      Optional newline- or space-separated list of languages to include when
      registering the project config. Default is en_US.utf8.
    required: false
    default: "en_US.utf8"

  docker-image:
    description: >-
      Optional container image that contains WinCC OA. When set, registration and
      syntax check run inside the same image instance. When empty, the action
      runs on the current runner/container host.
    required: false
    default: ""

  register-project:
    description: >-
      Whether to create/register a runnable project config before the syntax
      check. Required for WCCOAui -syntax. Registration always uses --runnable
      true and, with docker-image, runs in the same container as the check.
    required: false
    default: "true"

  mode:
    description: "Check mode: all, scripts, panels"
    required: false
    default: "all"

  integrity:
    description: "If true, performs integrity check"
    required: false
    default: "false"

  timeout-ms:
    description: "Timeout in milliseconds for the WCCOAui process"
    required: false
    default: "60000"

  scripts-path:
    description: "Optional start path for scripts mode (-s)"
    required: false
    default: ""

  panels-path:
    description: "Optional start path for panels mode (-p)"
    required: false
    default: ""

  register-package-version:
    description: >-
      Version/dist-tag for @winccoa-tools-pack/npm-winccoa-register-project when
      register-project is true.
    required: false
    default: "1.1.1"

  package-version:
    description: >-
      Version or dist-tag of @winccoa-tools-pack/npm-winccoa-syntax-check
      (for example 0.1.0 or latest). Do not use git refs such as main.
    required: false
    default: "0.1.0"

  node-version:
    description: "Node.js major version installed when the environment has no Node"
    required: false
    default: "22"

outputs:
  error-count:
    description: "Number of detected syntax errors (best-effort)"
    value: ${{ steps.run.outputs.error-count }}

runs:
  using: "composite"
  steps:
    - name: Run syntax check via public npm package
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PROJECT_PATH: ${{ inputs.path }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        OA_VERSION: ${{ inputs.winccoa-version }}
        DOCKER_IMAGE: ${{ inputs.docker-image }}
        MODE: ${{ inputs.mode }}
        INTEGRITY: ${{ inputs.integrity }}
        TIMEOUT_MS: ${{ inputs.timeout-ms }}
        SCRIPTS_PATH: ${{ inputs.scripts-path }}
        PANELS_PATH: ${{ inputs.panels-path }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        NODE_VERSION: ${{ inputs.node-version }}
        REGISTER_PROJECT: ${{ inputs.register-project }}
        REGISTER_PACKAGE_VERSION: ${{ inputs.register-package-version }}
        LANGUAGES: ${{ inputs.languages }}
      run: bash "${{ github.action_path }}/scripts/run.sh"
