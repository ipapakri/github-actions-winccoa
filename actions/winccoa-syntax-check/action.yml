name: "WinCC OA Syntax Check"
description: "Run WinCC OA syntax validation via @winccoa-tools-pack/npm-winccoa-syntax-check"
author: "winccoa-tools-pack"

inputs:
  path:
    description: "Path to WinCC OA project root relative to the repository root"
    required: false
    default: "."

  fail-on-error:
    description: "Fail workflow on syntax errors"
    required: false
    default: "true"

  winccoa-version:
    description: "WinCC OA version installed in the image/host, for example 3.21"
    required: true

  languages:
    description: >-
      Optional newline- or space-separated list of languages to include when
      registering the project config. Default is en_US.utf8.
    required: false
    default: "en_US.utf8"

  docker-image:
    description: >-
      Optional container image that contains WinCC OA. When set, registration and
      syntax check run inside that image. When empty, the action runs on the
      current runner/container host.
    required: false
    default: ""

  register-project:
    description: "Whether to create/register a project config before the syntax check"
    required: false
    default: "true"

  mode:
    description: "Check mode: all, scripts, panels"
    required: false
    default: "all"

  integrity:
    description: "If true, performs integrity check"
    required: false
    default: "false"

  timeout-ms:
    description: "Timeout in milliseconds for the WCCOAui process"
    required: false
    default: "60000"

  scripts-path:
    description: "Optional start path for scripts mode (-s)"
    required: false
    default: ""

  panels-path:
    description: "Optional start path for panels mode (-p)"
    required: false
    default: ""

  register-package-version:
    description: >-
      Version/dist-tag for @winccoa-tools-pack/npm-winccoa-register-project when
      register-project is true.
    required: false
    default: "1.1.0"

  package-version:
    description: >-
      Version or dist-tag of @winccoa-tools-pack/npm-winccoa-syntax-check
      (for example 0.1.0 or latest). Do not use git refs such as main.
    required: false
    default: "0.1.0"

  node-version:
    description: "Node.js major version installed when the environment has no Node"
    required: false
    default: "22"

outputs:
  error-count:
    description: "Number of detected syntax errors (best-effort)"
    value: ${{ steps.run.outputs.error-count }}

runs:
  using: "composite"
  steps:
    - name: Register project (optional)
      if: ${{ inputs.register-project == 'true' }}
      uses: winccoa-tools-pack/github-actions-winccoa/actions/winccoa-register-project@main
      with:
        project-path: ${{ inputs.path }}
        languages: ${{ inputs.languages }}
        winccoa-version: ${{ inputs.winccoa-version }}
        docker-image: ${{ inputs.docker-image }}
        package-version: ${{ inputs.register-package-version }}
        node-version: ${{ inputs.node-version }}

    - name: Run syntax check via public npm package
      id: run
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        OA_VERSION: ${{ inputs.winccoa-version }}
        DOCKER_IMAGE: ${{ inputs.docker-image }}
        MODE: ${{ inputs.mode }}
        INTEGRITY: ${{ inputs.integrity }}
        TIMEOUT_MS: ${{ inputs.timeout-ms }}
        SCRIPTS_PATH: ${{ inputs.scripts-path }}
        PANELS_PATH: ${{ inputs.panels-path }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail

        case "${MODE}" in
          all|scripts|panels) ;;
          *)
            echo "::error::Invalid mode '${MODE}'. Expected all, scripts, or panels."
            exit 2
            ;;
        esac

        if ! [[ "${TIMEOUT_MS}" =~ ^[0-9]+$ ]] || [ "${TIMEOUT_MS}" -le 0 ]; then
          echo "::error::Invalid timeout-ms '${TIMEOUT_MS}'"
          exit 2
        fi

        if [ -z "${PACKAGE_VERSION}" ] || [ "${PACKAGE_VERSION}" = "main" ]; then
          echo "::error::package-version must be a published npm version or dist-tag (not main)"
          exit 2
        fi

        PROJECT_PATH_NORM="${PROJECT_PATH#./}"
        if [ -z "${PROJECT_PATH_NORM}" ]; then
          PROJECT_PATH_NORM="."
        fi

        PKG_NAME="@winccoa-tools-pack/npm-winccoa-syntax-check"
        PKG_SPEC="${PKG_NAME}@${PACKAGE_VERSION}"

        ensure_node() {
          if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
            echo "Using existing Node $(node -v) / npm $(npm -v)"
            return 0
          fi
          major="${NODE_VERSION}"
          case "$(uname -m)" in
            x86_64|amd64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 2 ;;
          esac
          echo "Node/npm not found; installing Node ${major} (${arch}) from nodejs.org"
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl xz-utils >/dev/null
          fi
          ver="$(curl -fsSL https://nodejs.org/dist/index.json | python3 -c "import json,sys; major=sys.argv[1]; data=json.load(sys.stdin); lts=[x['version'] for x in data if x['version'].startswith('v'+major+'.') and x.get('lts')]; cands=[x['version'] for x in data if x['version'].startswith('v'+major+'.')]; print((lts or cands)[0])" "${major}")"
          curl -fsSL "https://nodejs.org/dist/${ver}/node-${ver}-linux-${arch}.tar.xz" | tar -xJ -C /usr/local --strip-components=1
          hash -r || true
          echo "Installed Node $(node -v) / npm $(npm -v)"
        }

        run_syntax_cli() {
          local config_file="$1"
          ensure_node
          local workdir
          workdir="$(mktemp -d)"
          cd "${workdir}"
          npm init -y >/dev/null 2>&1
          echo "Installing ${PKG_SPEC}"
          npm install --silent --no-fund --no-audit "${PKG_SPEC}"
          local pkg_root="${workdir}/node_modules/@winccoa-tools-pack/npm-winccoa-syntax-check"
          local entry="${pkg_root}/dist/cjs/cli.js"
          if [ ! -f "${entry}" ]; then
            echo "::error::Missing CLI entry ${entry}"
            exit 2
          fi
          local args=(-v "${OA_VERSION}" -c "${config_file}" -m "${MODE}" -t "${TIMEOUT_MS}")
          if [ "${INTEGRITY}" = "true" ]; then
            args+=(-i)
          fi
          if [ -n "${SCRIPTS_PATH}" ]; then
            args+=(-s "${SCRIPTS_PATH}")
          fi
          if [ -n "${PANELS_PATH}" ]; then
            args+=(-p "${PANELS_PATH}")
          fi
          echo "Running: node ${entry} ${args[*]}"
          node "${entry}" "${args[@]}"
        }

        HOST_CONFIG_FILE="${GITHUB_WORKSPACE}/${PROJECT_PATH_NORM}/config/config"
        CONTAINER_CONFIG_FILE="/workspace/${PROJECT_PATH_NORM}/config/config"

        set +e
        if [ -n "${DOCKER_IMAGE}" ]; then
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker-image was set but docker is not available on the runner"
            exit 127
          fi
          if [ ! -f "${HOST_CONFIG_FILE}" ]; then
            echo "::error::Project config not found at ${HOST_CONFIG_FILE}. Enable register-project or provide a config first."
            exit 2
          fi

          echo "Running ${PKG_SPEC} inside ${DOCKER_IMAGE}"
          OUTPUT=$(docker run --rm \
            --user root \
            --shm-size=1g \
            -v "${GITHUB_WORKSPACE}:/workspace:rw" \
            -w /workspace \
            -e OA_VERSION="${OA_VERSION}" \
            -e MODE="${MODE}" \
            -e INTEGRITY="${INTEGRITY}" \
            -e TIMEOUT_MS="${TIMEOUT_MS}" \
            -e SCRIPTS_PATH="${SCRIPTS_PATH}" \
            -e PANELS_PATH="${PANELS_PATH}" \
            -e PACKAGE_VERSION="${PACKAGE_VERSION}" \
            -e NODE_VERSION="${NODE_VERSION}" \
            -e PKG_SPEC="${PKG_SPEC}" \
            -e CONFIG_FILE="${CONTAINER_CONFIG_FILE}" \
            "${DOCKER_IMAGE}" \
            bash -lc '
set -euo pipefail
if [ ! -d "/opt/WinCC_OA/${OA_VERSION}" ]; then
  echo "::error::WinCC OA install not found at /opt/WinCC_OA/${OA_VERSION}"
  exit 2
fi
if [ ! -f "${CONFIG_FILE}" ]; then
  echo "::error::Project config not found at ${CONFIG_FILE}"
  exit 2
fi
ensure_node() {
  if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
    echo "Using existing Node $(node -v) / npm $(npm -v)"
    return 0
  fi
  major="${NODE_VERSION}"
  case "$(uname -m)" in
    x86_64|amd64) arch="x64" ;;
    aarch64|arm64) arch="arm64" ;;
    *) echo "::error::Unsupported architecture: $(uname -m)"; exit 2 ;;
  esac
  echo "Node/npm not found; installing Node ${major} (${arch}) from nodejs.org"
  if command -v apt-get >/dev/null 2>&1; then
    apt-get update -qq
    apt-get install -y -qq ca-certificates curl xz-utils >/dev/null
  fi
  ver="$(curl -fsSL https://nodejs.org/dist/index.json | python3 -c "import json,sys; major=sys.argv[1]; data=json.load(sys.stdin); lts=[x[\"version\"] for x in data if x[\"version\"].startswith(\"v\"+major+\".\") and x.get(\"lts\")]; cands=[x[\"version\"] for x in data if x[\"version\"].startswith(\"v\"+major+\".\")]; print((lts or cands)[0])" "${major}")"
  curl -fsSL "https://nodejs.org/dist/${ver}/node-${ver}-linux-${arch}.tar.xz" | tar -xJ -C /usr/local --strip-components=1
  hash -r || true
  echo "Installed Node $(node -v) / npm $(npm -v)"
}
ensure_node
workdir="$(mktemp -d)"
cd "${workdir}"
npm init -y >/dev/null 2>&1
echo "Installing ${PKG_SPEC}"
npm install --silent --no-fund --no-audit "${PKG_SPEC}"
entry="${workdir}/node_modules/@winccoa-tools-pack/npm-winccoa-syntax-check/dist/cjs/cli.js"
if [ ! -f "${entry}" ]; then
  echo "::error::Missing CLI entry ${entry}"
  exit 2
fi
args=(-v "${OA_VERSION}" -c "${CONFIG_FILE}" -m "${MODE}" -t "${TIMEOUT_MS}")
if [ "${INTEGRITY}" = "true" ]; then args+=(-i); fi
if [ -n "${SCRIPTS_PATH}" ]; then args+=(-s "${SCRIPTS_PATH}"); fi
if [ -n "${PANELS_PATH}" ]; then args+=(-p "${PANELS_PATH}"); fi
echo "Running: node ${entry} ${args[*]}"
set +e
OUTPUT=$(node "${entry}" "${args[@]}" 2>&1)
EC=$?
set -e
printf "%s\n" "${OUTPUT}"
ERROR_COUNT=$(printf "%s\n" "${OUTPUT}" | grep -Eic "error:|SEVERE|FATAL|syntax error" || true)
echo "error-count=${ERROR_COUNT}"
echo "exit-code=${EC}"
exit "${EC}"
' 2>&1)
          EXIT_CODE=$?
        else
          if [ ! -f "${HOST_CONFIG_FILE}" ]; then
            echo "::error::Project config not found at ${HOST_CONFIG_FILE}. Enable register-project or provide a config first."
            exit 2
          fi
          if [ ! -d "/opt/WinCC_OA/${OA_VERSION}" ]; then
            echo "::error::WinCC OA install not found at /opt/WinCC_OA/${OA_VERSION}. Provide docker-image or run inside a WinCC OA container."
            exit 2
          fi
          echo "Running ${PKG_SPEC} on current host/container"
          OUTPUT=$(run_syntax_cli "${HOST_CONFIG_FILE}" 2>&1)
          EXIT_CODE=$?
        fi
        set -e

        echo "--- Syntax check output ---"
        printf '%s\n' "${OUTPUT}"
        echo "--- end output ---"

        ERROR_COUNT=$(printf '%s\n' "${OUTPUT}" | sed -n 's/^error-count=//p' | tail -n1)
        if [ -z "${ERROR_COUNT}" ]; then
          ERROR_COUNT=$(printf '%s\n' "${OUTPUT}" | grep -Eic 'error:|SEVERE|FATAL|syntax error' || true)
        fi
        if [ "${ERROR_COUNT}" = "0" ] && [ "${EXIT_CODE}" -ne 0 ]; then
          ERROR_COUNT=1
        fi
        echo "error-count=${ERROR_COUNT}" >> "${GITHUB_OUTPUT}"

        if [ "${EXIT_CODE}" -ne 0 ]; then
          MESSAGE="Syntax check failed (exit ${EXIT_CODE}). Parsed errors: ${ERROR_COUNT}"
          if [ "${FAIL_ON_ERROR}" = "true" ]; then
            echo "::error::${MESSAGE}"
            exit "${EXIT_CODE}"
          fi
          echo "::warning::${MESSAGE}"
        fi