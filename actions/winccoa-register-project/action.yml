name: "WinCC OA Register Project"
description: "Register a WinCC OA project using @winccoa-tools-pack/npm-winccoa-register-project"
author: "winccoa-tools-pack"

inputs:
  project-path:
    description: "Path to the main WinCC OA project directory (e.g., src/Squirt)"
    required: true

  sub-projects:
    description: >-
      Optional newline-separated list of sub-project paths or install-relative
      IDs (one per line). Forwarded as repeated --sub-project flags.
    required: false
    default: ""

  languages:
    description: >-
      Languages to configure. Accepts space-separated or newline-separated full
      locale names (e.g., en_US.utf8 de_AT.utf8).
    required: true

  winccoa-version:
    description: "WinCC OA version (e.g., 3.21). Required."
    required: true

  docker-image:
    description: >-
      Optional container image that contains WinCC OA. When set, the public npm
      CLI runs inside that image with the workspace mounted at /workspace.
      When empty, the action runs on the current runner/job container host.
    required: false
    default: ""

  package-version:
    description: >-
      Version or dist-tag of @winccoa-tools-pack/npm-winccoa-register-project
      (for example 1.1.1 or latest). Do not use git refs such as main.
    required: false
    default: "1.1.1"

  node-version:
    description: "Node.js major version installed when the environment has no Node"
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Register project via public npm package
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        SUB_PROJECTS: ${{ inputs.sub-projects }}
        LANGUAGES: ${{ inputs.languages }}
        WINCCOA_VERSION: ${{ inputs.winccoa-version }}
        DOCKER_IMAGE: ${{ inputs.docker-image }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail

        if [ -z "${WINCCOA_VERSION}" ]; then
          echo "::error::winccoa-version is required"
          exit 2
        fi
        if [ -z "${LANGUAGES}" ]; then
          echo "::error::languages is required"
          exit 2
        fi
        if [ -z "${PACKAGE_VERSION}" ] || [ "${PACKAGE_VERSION}" = "main" ]; then
          echo "::error::package-version must be a published npm version or dist-tag (not main)"
          exit 2
        fi

        PROJECT_PATH_NORM="${PROJECT_PATH#./}"
        if [ -z "${PROJECT_PATH_NORM}" ]; then
          PROJECT_PATH_NORM="."
        fi

        LANGS="$(printf '%s\n' "${LANGUAGES}" | tr '\n' ' ' | xargs | tr ' ' ',')"
        if [ -z "${LANGS}" ]; then
          echo "::error::languages resolved to an empty list"
          exit 2
        fi

        PKG_NAME="@winccoa-tools-pack/npm-winccoa-register-project"
        PKG_SPEC="${PKG_NAME}@${PACKAGE_VERSION}"

        ensure_node() {
          if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
            echo "Using existing Node $(node -v) / npm $(npm -v)"
            return 0
          fi

          local major="${NODE_VERSION}"
          local arch
          case "$(uname -m)" in
            x86_64|amd64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
            *)
              echo "::error::Unsupported architecture for Node bootstrap: $(uname -m)"
              return 2
              ;;
          esac

          echo "Node/npm not found; installing Node ${major} (${arch}) from nodejs.org"
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl xz-utils >/dev/null
          fi

          local ver
          ver="$(curl -fsSL "https://nodejs.org/dist/index.json" | \
            python3 -c "import json,sys; major=sys.argv[1]; data=json.load(sys.stdin); lts=[x['version'] for x in data if x['version'].startswith('v'+major+'.') and x.get('lts')]; cands=[x['version'] for x in data if x['version'].startswith('v'+major+'.')]; print((lts or cands)[0])" \
            "${major}")"

          local url="https://nodejs.org/dist/${ver}/node-${ver}-linux-${arch}.tar.xz"
          curl -fsSL "${url}" | tar -xJ -C /usr/local --strip-components=1
          hash -r || true
          echo "Installed Node $(node -v) / npm $(npm -v)"
        }

        run_register_cli() {
          local project_path="$1"
          ensure_node

          local workdir
          workdir="$(mktemp -d)"
          cd "${workdir}"
          npm init -y >/dev/null 2>&1
          echo "Installing ${PKG_SPEC}"
          npm install --silent --no-fund --no-audit "${PKG_SPEC}"

          local pkg_root="${workdir}/node_modules/@winccoa-tools-pack/npm-winccoa-register-project"
          local entry=""
          if [ -f "${pkg_root}/dist/cjs/cli.js" ]; then
            entry="${pkg_root}/dist/cjs/cli.js"
          elif [ -f "${pkg_root}/dist/cjs/index.js" ]; then
            # Prefer compiled CLI; fall back to index for older package layouts.
            entry="${pkg_root}/dist/cjs/index.js"
          else
            echo "::error::Could not find CLI entry in ${pkg_root}"
            ls -la "${pkg_root}" || true
            exit 2
          fi

          local args=(
            --project-path "${project_path}"
            --langs "${LANGS}"
            --wincc-oa-version "${WINCCOA_VERSION}"
            --runnable true
          )

          if [ -n "${SUB_PROJECTS}" ]; then
            while IFS= read -r sp || [ -n "${sp}" ]; do
              sp="$(printf '%s' "${sp}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "${sp}" ] && continue
              sp="${sp%\"}"
              sp="${sp#\"}"
              args+=(--sub-project "${sp}")
            done <<< "${SUB_PROJECTS}"
          fi

          echo "Running: node ${entry} ${args[*]}"
          node "${entry}" "${args[@]}"
        }

        if [ -n "${DOCKER_IMAGE}" ]; then
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker-image was set but docker is not available on the runner"
            exit 127
          fi

          HOST_PROJ_PATH="${GITHUB_WORKSPACE}/${PROJECT_PATH_NORM}"
          if [ ! -d "${HOST_PROJ_PATH}" ]; then
            if [ -d "${PROJECT_PATH}" ]; then
              HOST_PROJ_PATH="${PROJECT_PATH}"
            else
              echo "::error::Project path does not exist: ${HOST_PROJ_PATH}"
              exit 2
            fi
          fi
          if [ ! -d "/opt/WinCC_OA/${WINCCOA_VERSION}" ]; then
            echo "::error::WinCC OA install not found at /opt/WinCC_OA/${WINCCOA_VERSION}. Provide docker-image or run inside a WinCC OA container."
            exit 2
          fi
          run_register_cli "${HOST_PROJ_PATH}"
        fi