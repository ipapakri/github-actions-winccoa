name: "WinCC OA Register Project"
description: "Create, configure and register a WinCC OA project configuration file with language support"
author: "winccoa-tools-pack"

inputs:
  project-path:
    description: "Path to the main WinCC OA project directory (e.g., src/Squirt)"
    required: true

  sub-projects:
    description: "Optional newline-separated list of sub-project identifiers or paths (one per line). Supports IDs or paths, and IDs may contain spaces."
    required: false
    default: ""


  languages:
    description: "Languages to configure, space-separated full locale names (e.g., en_US.utf8 de_AT.utf8)"
    required: true

  winccoa-version:
    description: "WinCC OA version (e.g., 3.21)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run npm helper to create and register project
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        SUB_PROJECTS: ${{ inputs.sub-projects }}
        LANGUAGES: ${{ inputs.languages }}
        WINCCOA_VERSION: ${{ inputs.winccoa-version }}
      run: |
        set -euo pipefail

        echo "Installing @winccoa-tools-pack/npm-winccoa-register-project@1.1.0..."
        npm install --no-save @winccoa-tools-pack/npm-winccoa-register-project@1.1.0

        echo "Running winccoa register helper..."
        # Install helper into the workspace and invoke its JS entry directly
        npm install --no-save @winccoa-tools-pack/npm-winccoa-register-project@1.1.0

        # Invoke the compiled CLI directly to ensure argument parsing matches local runs
        CMD=(node node_modules/@winccoa-tools-pack/npm-winccoa-register-project/dist/cjs/index.js
          --project-path "${PROJECT_PATH}"
          --langs "${LANGUAGES}"
        )

        # Convert newline-separated SUB_PROJECTS into repeated --sub-project args
        if [ -n "${SUB_PROJECTS}" ]; then
          while IFS= read -r sp || [ -n "${sp}" ]; do
            # skip empty lines
            [ -z "${sp}" ] && continue
            CMD+=(--sub-project "${sp}")
          done <<< "${SUB_PROJECTS}"
        fi

        if [ -n "${WINCCOA_VERSION}" ]; then
          CMD+=(--wincc-oa-version "${WINCCOA_VERSION}")
        fi

        echo "Inspecting WinCC OA installation inside image (if available):"
        echo "WINCCOA_IMAGE=${WINCCOA_IMAGE:-<not set>}"
        SIM_VERSIONS=""
        if command -v docker >/dev/null 2>&1; then
          echo "Listing /opt/WinCC_OA inside image $WINCCOA_IMAGE (may fail if image not present):"
          # list entries (one per line) and also print full long listing for visibility
          docker run --rm "${WINCCOA_IMAGE}" sh -c 'ls -la /opt/WinCC_OA || true'
          # capture potential version directories (lines starting with digit like 3.21)
          VERSIONS_RAW=$(docker run --rm "${WINCCOA_IMAGE}" sh -c 'ls -1 /opt/WinCC_OA 2>/dev/null || true') || true
          if [ -n "${VERSIONS_RAW}" ]; then
            # filter lines that look like version names (start with digit) and join with commas
            SIM_VERSIONS=$(echo "${VERSIONS_RAW}" | grep -E '^[0-9]' || true | tr '\n' ',' | sed 's/,$//')
          fi
        else
          echo "docker not available on runner; skipping image inspection"
        fi

        if [ -n "${SIM_VERSIONS}" ]; then
          echo "Detected WinCC OA versions in image: ${SIM_VERSIONS}"
          # only add simulated versions when a specific WINCCOA_VERSION wasn't supplied
          if [ -z "${WINCCOA_VERSION}" ]; then
            CMD+=(--simulated-winccoa-versions "${SIM_VERSIONS}")
          else
            echo "WINCCOA_VERSION is set (${WINCCOA_VERSION}); not adding --simulated-winccoa-versions"
          fi
        fi

        echo "Executing: ${CMD[*]}"
        "${CMD[@]}"
