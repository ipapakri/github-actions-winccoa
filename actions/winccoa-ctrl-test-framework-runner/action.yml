name: "WinCC OA Run Tests"
description: "Execute WinCC OA tests using the TestFramework with language support"
author: "winccoa-tools-pack"

inputs:
  winccoa-test-path:
    description: "Path to the test project (e.g., tests/WinCC_OA_Test)"
    required: true

  test-run-id:
    description: "Unique test run identifier (e.g., Squirt-regression)"
    required: true

  languages:
    description: "Test languages, space-separated full locale names (e.g., en_US.utf8 de_AT.utf8)"
    required: true

  winccoa-version:
    description: "WinCC OA version (e.g., 3.21)"
    required: true

  upload-artifacts:
    description: "Upload failed tests and results as artifacts"
    required: false
    default: "true"

  publish-junit-report:
    description: "Publish jUnit report as GitHub check"
    required: false
    default: "true"

  parse-results:
    description: "Whether to parse jUnit results and populate action outputs (may be slow for very large test sets)"
    required: false
    default: "false"

outputs:
  test-count:
    description: "Total number of tests executed"
    value: ${{ steps.parse-results.outputs.test-count }}

  failure-count:
    description: "Number of test failures"
    value: ${{ steps.parse-results.outputs.failure-count }}

  error-count:
    description: "Number of test errors"
    value: ${{ steps.parse-results.outputs.error-count }}

  junit-report-file:
    description: "Path to generated jUnit XML file"
    value: ${{ steps.parse-results.outputs.junit-report-file }}

  failed-projects-path:
    description: "Path to failed projects directory"
    value: ${{ steps.parse-results.outputs.failed-projects-path }}

runs:
  using: "composite"
  steps:
    - name: Register custom WinCC OA Test Framework project
      id: setup
      uses: ./actions/winccoa-register-project
      with:
        project-path: ${{ inputs.winccoa-test-path }}/Projects/TfCustomized
        sub-projects: |
          TestFramework_${{ inputs.winccoa-version }}
          ${{ inputs.winccoa-test-path }}/Projects/Global
        languages: ${{ inputs.languages }}
        winccoa-version: ${{ inputs.winccoa-version }}

    - name: Set additional config entries for TfCustomized
      shell: bash
      id: set-test-path
      run: |
        set -euo pipefail
        WINCC_OA_TEST_PATH="${GITHUB_WORKSPACE}/${{ inputs.winccoa-test-path }}"
        TF_CUSTOMIZED_PATH="${WINCC_OA_TEST_PATH}/Projects/TfCustomized"
        echo "Setting additional config entries for test framework..."
        echo "  Test project path: ${TF_CUSTOMIZED_PATH}"
        echo "  Test run ID: ${{ inputs.test-run-id }}"
        
        # Set additional config entries in the test project
        CONFIG_FILE="${TF_CUSTOMIZED_PATH}/config/config"
        if [ -f "${CONFIG_FILE}" ]; then
          echo '[testFramework]' >> "${CONFIG_FILE}"
          echo '# path with tests' >> "${CONFIG_FILE}"
          echo "installPath = \"${WINCC_OA_TEST_PATH}\"" >> "${CONFIG_FILE}"
          echo '# jUnit export defaults' >> "${CONFIG_FILE}"
          echo 'jUnitStackTraceDetail = "noPass"' >> "${CONFIG_FILE}"
          echo '# jUnitTestCaseIdFormat = "{TEST_CASE_ID} DB:${WinCCOA_databaseType}"' >> "${CONFIG_FILE}"
          echo 'jUnitAddSystemEnvironmentAsProperties = 1' >> "${CONFIG_FILE}"
          echo "Additional config entries set successfully."
        else
          echo "::error::Config file not found at ${CONFIG_FILE}"
          exit 1
        fi

    - name: Ensure test directories exist
      shell: bash
      run: |
        set -euo pipefail
        WINCC_OA_TEST_PATH="${GITHUB_WORKSPACE}/${{ inputs.winccoa-test-path }}"
        TF_CUSTOMIZED_PATH="${WINCC_OA_TEST_PATH}/Projects/TfCustomized"
        mkdir -p "${WINCC_OA_TEST_PATH}/Results"
        mkdir -p "${TF_CUSTOMIZED_PATH}/log"
        mkdir -p "${WINCC_OA_TEST_PATH}/Projects/Stored"

    - name: Execute WinCC OA tests
      id: run-tests
      shell: bash
      env:
        TEST_RUN_ID: ${{ inputs.test-run-id }}
        LANGUAGES: ${{ inputs.languages }}
        WINCCOA_VERSION: ${{ inputs.winccoa-version }}
      run: |
        set -euo pipefail
        
        WINCCOA_BIN="/opt/WinCC_OA/${WINCCOA_VERSION}/bin"
        WINCC_OA_TEST_PATH="${GITHUB_WORKSPACE}/${{ inputs.winccoa-test-path }}"
        TF_CUSTOMIZED_PATH="${WINCC_OA_TEST_PATH}/Projects/TfCustomized"
        
        echo "Starting WinCC OA test execution..."
        echo "  Test run ID: ${TEST_RUN_ID}"
        
        cd "${WINCCOA_BIN}"
        
        # Execute tests with testRunner.ctl
        TEST_PARAMS="{'testRunId':'${TEST_RUN_ID}','registerGlobalProject':true,'registerAllTools':true,'registerAllTemplates':true,'showLogViewer':false,'TfTestManager.checkForPossibleFreezeTests':true}"
      
        ./WCCOActrl \
          -config "${TF_CUSTOMIZED_PATH}/config/config" \
          -n testRunner.ctl "${TEST_PARAMS}" \
          -log +stderr 
           || {
          EXIT_CODE=$?
          echo "::warning::WCCOActrl test runner exited with code ${EXIT_CODE}"
          echo "EXIT_CODE=${EXIT_CODE}" >> $GITHUB_ENV
        }
        
        echo "Test execution completed."

    - name: Convert test results to jUnit format
      id: convert
      shell: bash
      env:
        WINCCOA_VERSION: ${{ inputs.winccoa-version }}
        LANGUAGES: ${{ inputs.languages }}
      run: |
        set -euo pipefail

        WINCCOA_BIN="/opt/WinCC_OA/${WINCCOA_VERSION}/bin"
        WINCC_OA_TEST_PATH="${GITHUB_WORKSPACE}/${{ inputs.winccoa-test-path }}"
        TF_CUSTOMIZED_PATH="${WINCC_OA_TEST_PATH}/Projects/TfCustomized"
        
        echo "Converting test results to jUnit format..."
        
        cd "${WINCCOA_BIN}"
        
        ./WCCOActrl \
          -config "${TF_CUSTOMIZED_PATH}/config/config" \
          -n oaTestParsers/jsonToJUnit.ctl \
          -log +stderr || {
          EXIT_CODE=$?
          echo "::warning::jUnit conversion exited with code ${EXIT_CODE}"
        }
        
        echo "Result conversion completed."

    - name: Parse test results
      id: parse-results
      if: ${{ inputs.parse-results == 'true' }}
      shell: bash
      env:
        WINCC_OA_TEST_PATH: ${{ inputs.winccoa-test-path }}
      run: |
        set -euo pipefail

        WINCC_OA_TEST_PATH="${GITHUB_WORKSPACE}/${{ inputs.winccoa-test-path }}"
        RESULTS_DIR="${WINCC_OA_TEST_PATH}/Results"
        FAILED_DIR="${WINCC_OA_TEST_PATH}/Projects/Stored/Failed"

        # Count test results
        TEST_COUNT=0
        FAILURE_COUNT=0
        ERROR_COUNT=0
        JUNIT_FILE=""

        if [ -d "${RESULTS_DIR}" ]; then
          JUNIT_FILE=$(find "${RESULTS_DIR}" -name "jUnit*.xml" -type f | head -1)

          if [ -n "${JUNIT_FILE}" ]; then
            TEST_COUNT=$(grep -o 'tests="[0-9]*"' "${JUNIT_FILE}" | head -1 | grep -o '[0-9]*' || echo "0")
            FAILURE_COUNT=$(grep -o 'failures="[0-9]*"' "${JUNIT_FILE}" | head -1 | grep -o '[0-9]*' || echo "0")
            ERROR_COUNT=$(grep -o 'errors="[0-9]*"' "${JUNIT_FILE}" | head -1 | grep -o '[0-9]*' || echo "0")
            echo "::notice::Test Results - Total: ${TEST_COUNT}, Failures: ${FAILURE_COUNT}, Errors: ${ERROR_COUNT}"
          fi
        fi

        # Check for failed projects
        FAILED_PROJECTS_PATH=""
        if [ -d "${FAILED_DIR}" ] && [ "$(ls -A "${FAILED_DIR}")" ]; then
          FAILED_PROJECTS_PATH="${FAILED_DIR}"
          echo "::warning::Failed test projects found at: ${FAILED_PROJECTS_PATH}"
        fi

        echo "test-count=${TEST_COUNT}" >> $GITHUB_OUTPUT
        echo "failure-count=${FAILURE_COUNT}" >> $GITHUB_OUTPUT
        echo "error-count=${ERROR_COUNT}" >> $GITHUB_OUTPUT
        echo "junit-report-file=${JUNIT_FILE}" >> $GITHUB_OUTPUT
        echo "failed-projects-path=${FAILED_PROJECTS_PATH}" >> $GITHUB_OUTPUT

    - name: Upload test artifacts
      if: ${{ inputs.upload-artifacts == 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ inputs.winccoa-test-path }}/Results/
        if-no-files-found: warn

    - name: Upload failed test projects
      if: ${{ inputs.upload-artifacts == 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: failed-tests
        path: ${{ inputs.winccoa-test-path }}/Projects/Stored/Failed/
        if-no-files-found: ignore

    - name: Publish jUnit report
      if: ${{ inputs.publish-junit-report == 'true' && always() }}
      uses: mikepenz/action-junit-report@v4
      with:
        fail_on_failure: true
        require_tests: true
        report_paths: ${{ inputs.winccoa-test-path }}/Results/jUnit*.xml
        detailed_summary: true
