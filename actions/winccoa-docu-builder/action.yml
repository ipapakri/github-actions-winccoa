name: "WinCC OA Docu Builder"
description: >-
  Build WinCC OA project help/docs via
  @winccoa-tools-pack/npm-winccoa-docu-builder (worker + DocuBuilder model)
author: "winccoa-tools-pack"

inputs:
  path:
    description: >-
      Path to the runnable WinCC OA worker / source project root relative to the
      repository root (e.g. src/Squirt)
    required: false
    default: "."

  company-name:
    description: >-
      Company/organization label passed to buildHelp.ctl. Empty defaults to
      GitHub org name, then repository name, then "WinCC OA community".
    required: false
    default: ""

  fail-on-error:
    description: "Fail the job when the docs build fails"
    required: false
    default: "true"

  winccoa-version:
    description: "WinCC OA version installed in the image/host, for example 3.21"
    required: true

  languages:
    description: >-
      Optional newline- or space-separated list of languages for worker project
      registration. Default is en_US.utf8.
    required: false
    default: "en_US.utf8"

  docker-image:
    description: >-
      Optional container image that contains WinCC OA. When set, registration and
      docs build run inside the same image instance. When empty, the action
      runs on the current runner/container host.
    required: false
    default: ""

  register-project:
    description: >-
      When true (default), the package registers DocuBuilder (non-runnable) and
      the worker project (runnable, DocuBuilder as sub-project) before running.
      Set false only when that registration was already done.
    required: false
    default: "true"

  timeout-ms:
    description: "Timeout in milliseconds for the WCCOActrl process"
    required: false
    default: "600000"

  package-version:
    description: >-
      Version or dist-tag of @winccoa-tools-pack/npm-winccoa-docu-builder
      (for example 0.1.0 or latest). Do not use git refs such as main.
    required: false
    default: "0.1.0"

  log-path:
    description: >-
      Where to write the captured WCCOActrl/docs log (relative to workspace).
    required: false
    default: ".artifacts/docu-builder.log"

  warning-output-file:
    description: "Path (relative to workspace) where extracted warnings are written."
    required: false
    default: ".artifacts/doxygen-warnings.txt"

  annotate-warnings:
    description: "Emit parsed warnings as GitHub annotations."
    required: false
    default: "true"

  max-warning-count:
    description: "Maximum allowed warning count; -1 disables threshold enforcement."
    required: false
    default: "-1"

  max-annotations:
    description: "Maximum number of warning annotations to emit."
    required: false
    default: "200"

  install-doxygen:
    description: >-
      When true, attempt apt-get install of doxygen and graphviz inside the
      container/host before building.
    required: false
    default: "true"

  node-version:
    description: "Node.js major version installed when the environment has no Node"
    required: false
    default: "22"

outputs:
  exit-code:
    description: "Process exit code from the docs CLI"
    value: ${{ steps.run.outputs.exit-code }}
  log-path:
    description: "Path to the captured docs-build log file"
    value: ${{ steps.run.outputs.log-path }}
  warning-count:
    description: "Count of extracted warning lines from the docs build output"
    value: ${{ steps.run.outputs.warning-count }}
  warning-file:
    description: "Workspace-relative path to extracted warning lines"
    value: ${{ steps.run.outputs.warning-file }}

runs:
  using: "composite"
  steps:
    - name: Run docs build via public npm package
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PROJECT_PATH: ${{ inputs.path }}
        COMPANY_NAME_INPUT: ${{ inputs.company-name }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        OA_VERSION: ${{ inputs.winccoa-version }}
        DOCKER_IMAGE: ${{ inputs.docker-image }}
        REGISTER_PROJECT: ${{ inputs.register-project }}
        TIMEOUT_MS: ${{ inputs.timeout-ms }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        NODE_VERSION: ${{ inputs.node-version }}
        LANGUAGES: ${{ inputs.languages }}
        LOG_PATH: ${{ inputs.log-path }}
        WARNING_OUTPUT_FILE: ${{ inputs.warning-output-file }}
        ANNOTATE_WARNINGS: ${{ inputs.annotate-warnings }}
        MAX_WARNING_COUNT: ${{ inputs.max-warning-count }}
        MAX_ANNOTATIONS: ${{ inputs.max-annotations }}
        INSTALL_DOXYGEN: ${{ inputs.install-doxygen }}
      run: bash "${{ github.action_path }}/scripts/run.sh"
